name: format-initializer

on:
  push:
    branches:
      - recover/template-initializer

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: recover/template-initializer

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write canonical formatting
        run: bun run format

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/init-template.mjs tests/unit/init-template.unit.test.ts package.json
          git commit -m "style: format template initializer"
          git push origin HEAD:recover/template-initializer
