name: Guitar tuner example

on:
  pull_request:
    paths:
      - "examples/guitar-tuner/**"
      - ".github/workflows/guitar-tuner-example.yml"
  push:
    branches:
      - main
    paths:
      - "examples/guitar-tuner/**"
      - ".github/workflows/guitar-tuner-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: examples/guitar-tuner
        run: bun install

      - name: Build frontend
        working-directory: examples/guitar-tuner
        run: bun run build

      - name: Verify Rust formatting
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo fmt -- --check

      - name: Resolve example Rust dependencies
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo generate-lockfile

      - name: Run Clippy
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo test --locked
