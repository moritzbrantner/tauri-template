name: Guitar tuner example

on:
  pull_request:
    paths:
      - "examples/guitar-tuner/**"
      - ".github/workflows/guitar-tuner-example.yml"
  push:
    branches:
      - main
    paths:
      - "examples/guitar-tuner/**"
      - ".github/workflows/guitar-tuner-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: examples/guitar-tuner
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: examples/guitar-tuner
        run: bun run build

      - name: Verify committed Rust lockfile
        working-directory: examples/guitar-tuner/src-tauri
        run: test -f Cargo.lock

      - name: Verify Rust formatting
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: examples/guitar-tuner/src-tauri
        run: cargo test --locked
