name: refresh-native-seams-lock

on:
  push:
    branches:
      - recover/tauri-native-seams

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: recover/tauri-native-seams

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Refresh workspace lock metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: refresh Rust workspace lock"
          git push origin HEAD:recover/tauri-native-seams
