name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - recover/deterministic-foundation
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast:
    name: Fast validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@8da6ad737d4746159414bde686d5c7422e0a9232
    with:
      operation: run
      tier: fast
      component: tauri-template
      strict: true
      install_mode: auto

  e2e:
    name: Browser E2E
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@8da6ad737d4746159414bde686d5c7422e0a9232
    with:
      bun_version: "1.4.0"
      install_command: bun install --frozen-lockfile
      e2e_command: bun run test:e2e
      install_playwright: true
      install_playwright_browsers: chromium

  native:
    name: Native Rust validation
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Check Rust workspace
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Rust workspace
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

  template-smoke:
    name: Fresh template smoke test
    needs: [fast, native]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify fresh generated state
        run: bun run template:smoke
