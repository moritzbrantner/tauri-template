name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast:
    name: Fast validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@8da6ad737d4746159414bde686d5c7422e0a9232
    with:
      operation: run
      tier: fast
      component: tauri-template
      strict: true
      install_mode: auto

  e2e:
    name: Browser E2E
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@8da6ad737d4746159414bde686d5c7422e0a9232
    with:
      bun_version: "1.4.0"
      install_command: bun install --frozen-lockfile
      e2e_command: bun run test:e2e
      install_playwright: true
      install_playwright_browsers: chromium

  native:
    outputs:
      allow-skipped: ${{ steps.merge-scope.outputs.allow-skipped }}
      validate-pages: ${{ steps.merge-scope.outputs.validate-pages }}
      validate-guitar-tuner-example: ${{ steps.merge-scope.outputs.validate-guitar-tuner-example }}
    name: Native Rust validation
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Determine required PR validation scope
        id: merge-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          filters = {'validate-pages': {'paths': ['src/**', 'public/**', 'index.html', 'examples/**', 'portfolio/**', 'scripts/build-pages.mjs', '.env.example', 'package.json', 'bun.lock', 'tsconfig.json', 'tsconfig.node.json', 'vite.config.ts', '.github/workflows/pages.yml'], 'branches': None}, 'validate-guitar-tuner-example': {'paths': ['examples/guitar-tuner/**', '.github/workflows/guitar-tuner-example.yml'], 'branches': None}}
          def matches(path, pattern):
              pattern = re.escape(pattern).replace(r"\*\*", ".*").replace(r"\*", "[^/]*").replace(r"\?", "[^/]")
              return re.fullmatch(pattern, path) is not None
          skipped = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, scope in filters.items():
                  matches_paths = scope["paths"] is None or any(matches(path, pattern) for path in paths if path for pattern in scope["paths"])
                  matches_branch = scope["branches"] is None or any(matches(os.environ["BASE_BRANCH"], pattern) for pattern in scope["branches"])
                  required = matches_paths and matches_branch
                  print(f"{name}={str(required).lower()}", file=output)
                  if not required:
                      skipped.append(name)
              print("allow-skipped=" + json.dumps(skipped), file=output)
          PYTHON

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets --all-features -- -D warnings

      - name: Check Rust workspace
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: Build Rust workspace
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

  native-runtime:
    name: Native Tauri runtime smoke
    needs: [fast, native]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb \
            jq \
            curl

      - name: Install exact Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build actual Tauri application
        run: bun run tauri build --no-bundle

      - name: Record native binary size
        run: bun run report:native-size

      - name: Exercise native IPC in the real WebView
        run: xvfb-run -a bun run test:native-runtime

  template-smoke:
    name: Fresh template smoke test
    needs: [fast, native]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify fresh generated state
        run: bun run template:smoke

  recipe-smoke:
    name: Recipe composition smoke test
    needs: [fast, native]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify every recipe and composed state
        run: bun run recipes:smoke

  validate-pages:
    needs: native
    if: github.event_name == 'pull_request' && needs.native.outputs.validate-pages == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  validate-guitar-tuner-example:
    needs: native
    if: github.event_name == 'pull_request' && needs.native.outputs.validate-guitar-tuner-example == 'true'
    uses: ./.github/workflows/guitar-tuner-example.yml
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: ["fast", "e2e", "native", "native-runtime", "template-smoke", "recipe-smoke", "validate-pages", "validate-guitar-tuner-example"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["fast", "e2e", "native", "native-runtime", "template-smoke", "recipe-smoke", "validate-pages", "validate-guitar-tuner-example"]'
          allow-skipped: ${{ needs.native.outputs.allow-skipped || '[]' }}
